<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 510" width="100%" height="100%">
  <defs>
    <!-- Background Grid -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>

    <!-- Gradients -->
    <linearGradient id="neon-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bf5af2" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#00f2fe" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#30d158" stop-opacity="0.6"/>
    </linearGradient>

    <linearGradient id="burn-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff4500" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ff9f0a" stop-opacity="0.05"/>
    </linearGradient>

    <linearGradient id="bounty-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#007aff" stop-opacity="0.05"/>
    </linearGradient>

    <linearGradient id="dev-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#30d158" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <!-- Dark Background -->
  <rect width="1200" height="510" fill="#0b0c12" rx="20"/>
  <rect width="1200" height="510" fill="url(#grid)" rx="20"/>

  <!-- Border -->
  <rect x="20" y="20" width="1160" height="470" rx="16" fill="none" stroke="url(#neon-border)" stroke-width="1.5" stroke-opacity="0.5"/>

  <!-- LEFT PANEL -->
  <!-- Status Tag -->
  <g transform="translate(60, 50)">
    <rect width="260" height="32" rx="16" fill="#161824" stroke="#bf5af2" stroke-opacity="0.4" stroke-width="1"/>
    <circle cx="20" cy="16" r="4" fill="#00f2fe"/>
    <text x="34" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#00f2fe" letter-spacing="1">TOKEN-2022 • IMMUTABLE</text>
  </g>

  <!-- Title & Subtitle -->
  <g transform="translate(60, 130)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="42" font-weight="800" fill="#ffffff" letter-spacing="-0.5">pQT Protocol <tspan fill="#bf5af2">$pQT</tspan></text>
    <text x="0" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" fill="#8e8ea0">Deflationary Quantitative Tightening Architecture on Solana</text>
  </g>

  <!-- Total Supply -->
  <g transform="translate(60, 210)">
    <text x="0" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#6c6c80" letter-spacing="1">TOTAL SUPPLY</text>
    <text x="0" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="700" fill="#ffffff">10,000,000,000 <tspan font-size="20" fill="#00f2fe">pQT</tspan></text>
  </g>

  <!-- 3 Cards -->
  <g transform="translate(60, 320)">
    <!-- Card 1: Authorities -->
    <rect x="0" y="0" width="160" height="65" rx="10" fill="#121420" stroke="#2a2d40" stroke-width="1"/>
    <text x="15" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#8e8ea0" font-weight="600">AUTHORITIES</text>
    <text x="15" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#ff4500" font-weight="700">All Revoked 🔒</text>

    <!-- Card 2: Harvest -->
    <rect x="172" y="0" width="160" height="65" rx="10" fill="#121420" stroke="#2a2d40" stroke-width="1"/>
    <text x="187" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#8e8ea0" font-weight="600">HARVEST ENGINE</text>
    <text x="187" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#00f2fe" font-weight="700">Smart Contract ⚙️</text>

    <!-- Card 3: Transfer Fee -->
    <rect x="344" y="0" width="160" height="65" rx="10" fill="#121420" stroke="#2a2d40" stroke-width="1"/>
    <text x="359" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#8e8ea0" font-weight="600">TRANSACTION FEE</text>
    <text x="359" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#30d158" font-weight="700">0.05% Fixed</text>
  </g>

  <!-- RIGHT PANEL: TAX DISTRIBUTION -->
  <g transform="translate(670, 50)">
    <rect width="470" height="385" rx="16" fill="#10121a" stroke="#202436" stroke-width="1.5"/>
    
    <text x="30" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#8e8ea0" letter-spacing="1">TAX DISTRIBUTION</text>

    <!-- Card 1: 80% Burn -->
    <g transform="translate(25, 60)">
      <rect width="420" height="90" rx="12" fill="url(#burn-grad)" stroke="#ff4500" stroke-opacity="0.4" stroke-width="1"/>
      <text x="25" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="40" font-weight="800" fill="#ff4500">80%</text>
      <text x="135" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#ffffff">Auto-Burn</text>
      <text x="135" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#a0a0b0">Permanently destroyed from supply</text>
    </g>

    <!-- Card 2: 15% Bounty -->
    <g transform="translate(25, 165)">
      <rect width="420" height="90" rx="12" fill="url(#bounty-grad)" stroke="#00f2fe" stroke-opacity="0.4" stroke-width="1"/>
      <text x="25" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="40" font-weight="800" fill="#00f2fe">15%</text>
      <text x="135" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#ffffff">Caller Bounty</text>
      <text x="135" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#a0a0b0">Instant reward for triggering harvest</text>
    </g>

    <!-- Card 3: 5% Dev Treasury -->
    <g transform="translate(25, 270)">
      <rect width="420" height="90" rx="12" fill="url(#dev-grad)" stroke="#30d158" stroke-opacity="0.4" stroke-width="1"/>
      <text x="25" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="40" font-weight="800" fill="#30d158">5%</text>
      <text x="135" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#ffffff">Dev Treasury</text>
      <text x="135" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#a0a0b0">Protocol development &amp; infrastructure</text>
    </g>
  </g>

  <!-- Bottom Accent Line -->
  <path d="M 60 465 L 1140 465" stroke="url(#neon-border)" stroke-width="1.5" stroke-opacity="0.6"/>
</svg>
